# Builds Burrow on a GitHub Mac (with Xcode) and keeps the app for a week.
name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version && swift --version
      - run: swift test --filter "WeeklyQuotaTests|BurrowFinishedIdleTests|IdleClaudeCompactionTests|ClaudeSilentTurnTests|BackgroundClaudeAgentTests|QuotaLookupDeadlineTests|AntigravityUsageSessionTests|ClaudeTranscriptTitleTests|RestoreMidTurnTests|DenLookAndCloseTests|DenCloseReopensHeldCardTests|PanelClickOutsideTests|DenRowsUnderPointerTests|SettingsWithHiddenPanelTests|DenBackSettingsTests"
      # Approvals (health check 2026-11-04 #1-3, 6, 7, 10, 16, 17) and the tests around them.
      - run: swift test --filter "AppStateToolUseCacheTests|ApprovalHealthCheckTests|CardShortcutTests|CommandGistTests|DangerousCommandTests|OpenCodeV2SupportTests|AppStatePermissionFlowTests|AppStateAnswerRoutingTests|BackgroundAgentApprovalTests|testEveryDangerHasAReasonInEveryLanguage"
      - run: ./build.sh
      - run: ditto -c -k --keepParent .build/release/Burrow.app Burrow.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Burrow
          path: Burrow.zip
          retention-days: 7
